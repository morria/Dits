name: Dits
options:
  bundleIdPrefix: com.w2asm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AmateurDigitalCore:
    path: ../../Amateur-Digital/AmateurDigital/AmateurDigitalCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 7Q2SS8772K
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Dits:
    type: application
    platform: iOS
    sources:
      - path: Dits
    dependencies:
      - package: AmateurDigitalCore
        product: AmateurDigitalCore
    info:
      path: Dits/Info.plist
      properties:
        CFBundleDisplayName: Dits
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: >-
          Dits listens to the audio from your radio (via a wired audio
          interface) to decode incoming Morse code.
        NSLocationWhenInUseUsageDescription: >-
          Dits uses your location once to fill in your Maidenhead grid
          square. Your location is never transmitted or stored elsewhere.
        NSBluetoothAlwaysUsageDescription: >-
          Dits connects to a Morserino-32 keyer over Bluetooth so your
          messages can be keyed on the radio.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.dits
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DitsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DitsTests
    dependencies:
      - target: Dits
      - package: AmateurDigitalCore
        product: AmateurDigitalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.dits.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dits.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dits"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Dits:
    build:
      targets:
        Dits: all
        DitsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DitsTests
